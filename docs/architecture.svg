<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <defs>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b04b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5aa9e6"/>
    </marker>
    <marker id="arr-gold-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#e8b04b"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1400" height="640" rx="16" fill="#0d1117"/>

  <!-- beat -->
  <rect x="460" y="24" width="240" height="76" rx="12" fill="#161b26" stroke="#2a3348"/>
  <text x="580" y="52" text-anchor="middle" fill="#e6eaf2" font-size="16" class="sans" font-weight="600">ferry beat</text>
  <text x="580" y="74" text-anchor="middle" fill="#8b96ad" font-size="12" class="sans">cron scheduler · one per broker</text>

  <!-- your app -->
  <rect x="40" y="200" width="270" height="240" rx="12" fill="#161b26" stroke="#2a3348"/>
  <text x="66" y="234" fill="#e8b04b" font-size="15" class="sans" font-weight="600">your Python app</text>
  <text x="66" y="268" fill="#8b96ad" font-size="13" class="mono">@app.task(queue="emails")</text>
  <text x="66" y="292" fill="#8b96ad" font-size="13" class="mono">def send_email(...): ...</text>
  <text x="66" y="330" fill="#e6eaf2" font-size="13" class="mono">send_email.delay(...)</text>
  <text x="66" y="354" fill="#e6eaf2" font-size="13" class="mono">app.chain(...).apply_async()</text>
  <text x="66" y="378" fill="#e6eaf2" font-size="13" class="mono">result.get(timeout=30)</text>
  <text x="66" y="412" fill="#5aa9e6" font-size="12" class="sans">producers · signatures · results</text>

  <!-- broker -->
  <rect x="400" y="140" width="360" height="360" rx="12" fill="#161b26" stroke="#e8b04b" stroke-width="1.5"/>
  <text x="424" y="176" fill="#e6eaf2" font-size="17" class="sans" font-weight="600">broker</text>
  <text x="424" y="198" fill="#8b96ad" font-size="12" class="sans">SQLite (WAL) · redis://</text>

  <rect x="424" y="220" width="312" height="56" rx="8" fill="#1c2331" stroke="#2a3348"/>
  <circle cx="448" cy="248" r="5" fill="#e8b04b"/>
  <text x="462" y="253" fill="#e6eaf2" font-size="14" class="mono">emails</text>
  <text x="712" y="253" text-anchor="end" fill="#8b96ad" font-size="13" class="sans">2 queued · priority</text>

  <rect x="424" y="288" width="312" height="56" rx="8" fill="#1c2331" stroke="#2a3348"/>
  <circle cx="448" cy="316" r="5" fill="#5aa9e6"/>
  <text x="462" y="321" fill="#e6eaf2" font-size="14" class="mono">default</text>
  <text x="712" y="321" text-anchor="end" fill="#8b96ad" font-size="13" class="sans">1 queued</text>

  <rect x="424" y="356" width="312" height="56" rx="8" fill="#1c2331" stroke="#2a3348"/>
  <circle cx="448" cy="384" r="5" fill="#8b96ad"/>
  <text x="462" y="389" fill="#e6eaf2" font-size="14" class="mono">delayed</text>
  <text x="712" y="389" text-anchor="end" fill="#8b96ad" font-size="13" class="sans">eta · countdown</text>

  <text x="424" y="446" fill="#8b96ad" font-size="12" class="sans">retries w/ backoff · dead-letter queue</text>
  <text x="424" y="470" fill="#8b96ad" font-size="12" class="sans">atomic claims · heartbeats · chord barriers</text>

  <!-- workers -->
  <rect x="850" y="200" width="270" height="240" rx="12" fill="#161b26" stroke="#2a3348"/>
  <text x="876" y="234" fill="#e6eaf2" font-size="15" class="sans" font-weight="600">workers × N</text>
  <rect x="876" y="254" width="218" height="26" rx="6" fill="#1c2331"/>
  <rect x="876" y="254" width="150" height="26" rx="6" fill="#3fb96f" opacity="0.55"/>
  <rect x="876" y="288" width="218" height="26" rx="6" fill="#1c2331"/>
  <rect x="876" y="288" width="90" height="26" rx="6" fill="#3fb96f" opacity="0.55"/>
  <rect x="876" y="322" width="218" height="26" rx="6" fill="#1c2331"/>
  <rect x="876" y="322" width="190" height="26" rx="6" fill="#3fb96f" opacity="0.55"/>
  <text x="876" y="380" fill="#8b96ad" font-size="12" class="sans">thread pool · any machine</text>
  <text x="876" y="402" fill="#8b96ad" font-size="12" class="sans">heartbeats · graceful shutdown</text>

  <!-- dashboard -->
  <rect x="460" y="540" width="240" height="76" rx="12" fill="#161b26" stroke="#2a3348"/>
  <text x="580" y="568" text-anchor="middle" fill="#e6eaf2" font-size="16" class="sans" font-weight="600">ferry dashboard</text>
  <text x="580" y="590" text-anchor="middle" fill="#8b96ad" font-size="12" class="sans">live UI · retry &amp; purge</text>

  <!-- arrows -->
  <!-- enqueue: app -> broker -->
  <line x1="310" y1="292" x2="392" y2="292" stroke="#e8b04b" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="351" y="280" text-anchor="middle" fill="#e8b04b" font-size="12" class="sans">enqueue</text>
  <!-- results: broker -> app -->
  <line x1="392" y1="352" x2="310" y2="352" stroke="#5aa9e6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
  <text x="351" y="344" text-anchor="middle" fill="#5aa9e6" font-size="12" class="sans">results</text>
  <!-- claim: broker -> workers -->
  <line x1="760" y1="320" x2="842" y2="320" stroke="#e8b04b" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="801" y="308" text-anchor="middle" fill="#e8b04b" font-size="12" class="sans">atomic claim</text>
  <!-- beat -> broker -->
  <line x1="580" y1="100" x2="580" y2="132" stroke="#5aa9e6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="592" y="120" fill="#5aa9e6" font-size="12" class="sans">cron slots</text>
  <!-- dashboard <-> broker -->
  <line x1="580" y1="500" x2="580" y2="532" stroke="#5aa9e6" stroke-width="2" marker-start="url(#arr-gold-rev)" marker-end="url(#arr-blue)"/>
  <text x="592" y="522" fill="#5aa9e6" font-size="12" class="sans">WebSocket stats</text>
</svg>
