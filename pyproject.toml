[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry"
version = "0.1.0"
description = "A lightweight distributed task queue for Python. SQLite-simple, production-serious."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sanjay Santhanam" }]
keywords = ["task-queue", "background-jobs", "workers", "distributed-systems", "scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "fakeredis[lua]>=2.20", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Sanjays2402/ferry"
Repository = "https://github.com/Sanjays2402/ferry"
Issues = "https://github.com/Sanjays2402/ferry/issues"

[project.scripts]
ferry = "ferry.cli:main"

[tool.setuptools.packages.find]
include = ["ferry*"]

[tool.setuptools.package-data]
ferry = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pragmatic set: errors, pyflakes, isort, pyupgrade, ruff-specific.
# (Deliberately not enabling BLE/S/DTZ: broad excepts are intentional here —
# a crashing task or event handler must never take down a worker — and the
# codebase's datetime conventions are consistent as-is.)
select = ["E", "F", "I", "UP", "RUF"]
